name: Manual Release ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Create ZIP Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r BlackHole-${{ github.event.inputs.version }}.zip . \
          -x ".git/*" \
          -x ".github/*"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: BlackHole ${{ github.event.inputs.version }}
          body: |
            Manual release created from GitHub Actions.
          artifacts: |
            BlackHole-${{ github.event.inputs.version }}.zip
